# Local trial on Odoo's official image, with the add-ons bind-mounted for quick iteration:
#   docker compose -f compose.trial.yaml up -d
# App: http://localhost:8069  Test inbox (catches all mail): http://localhost:8025
# Not named compose.yaml so devkit's compose discovery finds docker/compose.yaml (the deployment) instead.
# The official image runs Python 3.12; the deployment image runs 3.14, so add-on code must stay 3.12-compatible
# while this trial exists.
name: ticketing-system

services:
  odoo:
    image: odoo:20.0-20261102
    command: ["--database=tasks", "--db-filter=^tasks$", "--no-database-list"]
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    ports:
      - "8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./src/ticketing_system/addons:/mnt/extra-addons
    depends_on:
      - db
      - mailpit
    restart: unless-stopped

  db:
    image: postgres:17.12
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  odoo-data:
  db-data:
